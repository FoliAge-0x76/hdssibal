name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'data/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

# 只保留最新一次部署，避免并发写 gh-pages
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate data
        run: npm run validate:data

      - name: Build
        run: npm run build
        env:
          # 在 Settings → Secrets and variables → Actions → Variables 里配置。
          # 未配置中转层地址时，站点仍可用，只是登录弹窗会引导使用访问令牌。
          # 注意：OAuth App 的 Client ID / Secret 只存在于中转层（relay/），这里不需要。
          VITE_OAUTH_RELAY_URL: ${{ vars.VITE_OAUTH_RELAY_URL }}
          VITE_OAUTH_SCOPES: ${{ vars.VITE_OAUTH_SCOPES }}
          # 仅使用自定义域名时需要（GitHub Pages 域名会自动推断仓库坐标）
          VITE_GITHUB_OWNER: ${{ vars.VITE_GITHUB_OWNER }}
          VITE_GITHUB_REPO: ${{ vars.VITE_GITHUB_REPO }}

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # 首次部署时顺手把 Pages 打开并把 Source 设成 GitHub Actions，
          # 这样新仓库不必先手动去 Settings → Pages 点一次。
          # 若仓库策略不允许（令牌没有权限），这一步会失败并提示，
          # 那时改回手动切换 Source 即可。
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4